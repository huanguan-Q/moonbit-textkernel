name: textkernel CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install MoonBit (latest available)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/moon-install.sh
          bash /tmp/moon-install.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.moon/bin:$PATH"
          moon version --all

      - name: Format
        run: moon fmt --check

      - name: Check (all backends, warnings are errors)
        run: moon check --target all --deny-warn

      - name: Test (all backends)
        run: moon test --target all

      - name: Runnable example
        run: moon run src/demo --target native

      - name: CLI entry point
        run: moon run src/cli --target native -- --help

      - name: Validate package contents
        run: moon package --list

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install MoonBit (latest available)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/moon-install.sh
          bash /tmp/moon-install.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.moon/bin:$PATH"
          moon version --all

      - name: Committed artefact works
        # Proves the shipped .wasm is callable, not just present.
        run: |
          node examples/wasm-node/demo.mjs
          node examples/wasm-node/render.mjs
          node examples/wasm-node/ssr-middleware.mjs

      - name: Rebuild from source and verify
        # Proves the artefact is reproducible from the MoonBit sources.
        run: |
          node scripts/build_wasm.mjs
          node examples/wasm-node/demo.mjs
          node examples/wasm-node/render.mjs
          node examples/wasm-node/ssr-middleware.mjs

  proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      PROVE_TIME_SCALE: "10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install z3, opam and Why3
        run: |
          sudo apt-get update
          sudo apt-get install -y opam
          opam init --disable-sandboxing --bare -y
          opam switch create default --packages=ocaml-system -y || opam switch default
          eval "$(opam env)"
          opam install -y why3=1.7.2 alt-ergo
          echo "$HOME/.opam/default/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Register Why3 provers
        run: why3 config detect

      - name: Install modern Z3
        run: |
          python3 -m pip install --user z3-solver==4.15.4.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/z3" --version

      - name: Verify prover toolchain is visible
        run: |
          why3 --version
          z3 --version
          alt-ergo --version

      - name: Install MoonBit (latest available)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/moon-install.sh
          bash /tmp/moon-install.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.moon/bin:$PATH"
          moon version --all

      - name: Prove (10x limits, machine-int prelude)
        run: |
          # A bare `moon prove` can time out on a loaded runner. The gate
          # retries at ~10x limits and fails if a proof-enabled package is
          # skipped silently or if the goal count is zero.
          node scripts/prove_gate.mjs
